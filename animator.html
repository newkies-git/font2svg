<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanja Explorer</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f8fafc;
            --primary: #0284c7;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --panel: #f1f5f9;
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 24px rgba(15, 23, 42, 0.06);
            z-index: 10;
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }

        h1 { font-size: 1.25rem; font-weight: 800; margin: 0 0 16px; color: var(--primary); }

        .search-box {
            position: relative;
        }

        #search-input {
            width: 100%;
            padding: 12px 16px;
            padding-left: 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
        }

        #search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
            background: white;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        #results-grid {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 8px;
            align-content: start;
        }

        #results-grid::-webkit-scrollbar { width: 6px; }
        #results-grid::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

        .char-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }

        .char-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        .char-card.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
        }

        .char-card .glyph { font-size: 1.5rem; margin-bottom: 2px; }
        .char-card .eum { font-size: 0.7rem; color: var(--text-muted); }
        .char-card.active .eum { color: rgba(255, 255, 255, 0.9); }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 40px;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
            overflow: auto;
        }

        .work-row {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            justify-content: center;
            gap: 28px 40px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1100px;
        }
        .work-row .stage-column {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 16px;
        }
        .outline-below-viewbox {
            margin: 0;
            justify-content: center;
        }
        .outline-below-viewbox .outline-row-label {
            min-width: auto;
        }

        .stage-container {
            position: relative;
            background: var(--bg);
            padding: 20px;
            border-radius: 32px;
            box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.12);
            border: 1px solid var(--border);
        }

        .stage {
            width: 500px;
            height: 500px;
            background: var(--bg);
            border-radius: 16px;
            overflow: visible;
        }

        #glyph-layers.glyph-display-fill #glyph-bg,
        #glyph-layers.glyph-display-fill #glyph-main {
            fill: #0f172a;
            stroke: none;
        }

        #glyph-layers.glyph-display-stroke #glyph-bg,
        #glyph-layers.glyph-display-stroke #glyph-main {
            fill: none;
            stroke: #0f172a;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        #glyph-layers.glyph-display-stroke #glyph-bg {
            stroke-width: 11;
        }
        #glyph-layers.glyph-display-stroke #glyph-main {
            stroke-width: 6;
        }

        #glyph-layers .compare-path {
            display: none;
            stroke: none;
            fill-rule: evenodd;
            mix-blend-mode: multiply;
        }
        #glyph-layers.compare-on .compare-path { display: block; }
        #glyph-layers.compare-on #glyph-bg,
        #glyph-layers.compare-on #glyph-main { display: none; }

        #glyph-compare-data1  { fill: #64748b; fill-opacity: 0.55; }
        #glyph-compare-data2 { fill: #0284c7; fill-opacity: 0.55; }
        #glyph-compare-data3 { fill: #dc2626; fill-opacity: 0.55; }

        .compare-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 4px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .compare-legend .dot {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .compare-legend .dot::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: currentColor;
            opacity: 0.7;
        }
        .compare-legend .dot.data1   { color: #64748b; }
        .compare-legend .dot.data2  { color: #0284c7; }
        .compare-legend .dot.data3  { color: #dc2626; }
        .compare-legend .dot.missing { opacity: 0.35; text-decoration: line-through; }
        .btn-outline-text.compare-active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(2, 132, 199, 0.1);
        }

        .display-mode-row .outline-row-label {
            align-self: center;
        }
        .display-mode-buttons {
            display: flex;
            flex: 1;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn-display-mode.display-mode-active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(2, 132, 199, 0.1);
        }

        .grid-line { stroke: #cbd5e1; stroke-width: 1; opacity: 0.9; }
        .axis-line { stroke: #94a3b8; stroke-width: 2; }
        .axis-label { fill: #64748b; font-size: 24px; font-weight: 500; font-family: monospace; }
        .viewbox-border { fill: none; stroke: var(--primary); stroke-width: 2; stroke-dasharray: 8 8; opacity: 0.5; }

        .toolbar {
            margin-top: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 340px;
            max-width: 100%;
            flex: 0 0 auto;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            padding: 12px 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }

        .outline-step-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }
        .btn-step {
            min-width: 48px;
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #ffffff;
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-step:hover:not(:disabled),
        .btn-outline-text:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-step:disabled,
        .btn-outline-text:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        #outline-step-label {
            font-variant-numeric: tabular-nums;
            font-weight: 700;
            color: var(--primary);
            min-width: 72px;
            text-align: center;
            font-size: 0.95rem;
        }
        .btn-outline-text {
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #ffffff;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .outline-toolbar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        .outline-row-label {
            min-width: 100px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .sidebar-dataset-wrap {
            padding: 12px 24px 0;
        }
        .sidebar-dataset-wrap label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .sidebar-dataset-wrap select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
        }
        .sidebar-dataset-wrap select:hover,
        .sidebar-dataset-wrap select:focus {
            border-color: var(--primary);
            color: var(--primary);
        }

        .sidebar-refresh-wrap {
            padding: 0 24px 16px;
        }
        .btn-sidebar-refresh {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #ffffff;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-sidebar-refresh:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-sidebar-refresh:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .order-edit-controls-row {
            align-items: flex-start;
        }
        #order-edit-list {
            width: 100%;
            max-height: 280px;
            overflow: auto;
            padding: 0;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #ffffff;
        }

        .order-edit-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            color: var(--text-main);
        }
        .order-edit-table thead th {
            background: var(--panel);
            font-weight: 700;
            font-size: 0.72rem;
            color: var(--text-muted);
            text-align: center;
            padding: 8px 6px;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1;
            white-space: nowrap;
        }
        .order-edit-table tbody td {
            padding: 6px 8px;
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid var(--border);
        }
        .order-edit-table tbody tr:last-child td {
            border-bottom: none;
        }
        .order-edit-table tbody tr:hover td {
            background: #f8fafc;
        }
        .order-edit-table .col-idx {
            font-variant-numeric: tabular-nums;
            font-weight: 800;
            color: var(--primary);
            width: 2.5em;
        }
        .order-edit-table .col-order-current,
        .order-edit-table .col-radical-current {
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
        }
        .order-edit-table .col-order-current strong,
        .order-edit-table .col-radical-current strong {
            color: var(--text-main);
            font-weight: 800;
        }
        .order-edit-table .order-change-input {
            width: 4.5rem;
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.85rem;
            font-variant-numeric: tabular-nums;
        }
        .order-edit-table .col-path {
            width: 56px;
            padding: 4px;
            text-align: center;
        }
        .order-edit-table .col-path svg {
            display: block;
            width: 44px;
            height: 44px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 6px;
        }
        .order-edit-table .col-path svg path {
            fill: #0f172a;
            stroke: none;
        }
        .order-edit-table .order-change-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15);
        }
        .order-edit-hint {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
            padding: 12px;
        }
        .order-edit-actions {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .order-edit-table .order-radical-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 0 auto;
            font-weight: 600;
            font-size: 0.78rem;
            color: var(--text-main);
            cursor: pointer;
            user-select: none;
        }
        .order-edit-table .order-radical-wrap input {
            width: 1rem;
            height: 1rem;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .scale-control, .opacity-control, .offset-control {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .scale-control label, .opacity-control label, .offset-control label { 
            min-width: 100px; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            font-weight: 600;
        }
        .scale-control input, .opacity-control input, .offset-control input { flex: 1; accent-color: var(--primary); }
        .scale-control span, .opacity-control span, .offset-control span { min-width: 50px; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--primary); }

        #char-info {
            position: absolute;
            top: 40px;
            left: 40px;
            text-align: left;
        }
        #char-info h2 { font-size: 3rem; margin: 0; }
        #char-info p { color: var(--text-muted); margin: 4px 0; }

        .loader {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: none;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>Hanja Explorer</h1>
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="search-input" placeholder="한자 또는 음 검색...">
            </div>
            <div class="sidebar-dataset-wrap">
                <label for="dataset-select">데이터 폴더</label>
                <select id="dataset-select" onchange="onDatasetChange(this.value)">
                    <option value="data">NotoSerifKR</option>
                    <option value="data1">OpenMind</option>
                    <option value="data2">Biaukai</option>
                    <option value="data3">궁서체</option>
                </select>
            </div>
            <div class="sidebar-refresh-wrap">
                <button type="button" class="btn-sidebar-refresh" id="btn-refresh-data" onclick="refreshCurrentCharData()" disabled title="선택한 한자의 JSON 파일을 현재 데이터 폴더에서 다시 불러옵니다">데이터 새로 고침</button>
            </div>
        </div>
        <div id="results-grid"></div>
    </aside>

    <main class="main-content">
        <div id="loader" class="loader">Loading data...</div>

        <div id="char-info">
            <h2 id="display-char">-</h2>
            <p id="display-eum">Select a character</p>
        </div>

        <div class="work-row">
        <div class="stage-column">
        <div class="stage-container">
            <div class="stage">
                <svg viewBox="-500 -500 1000 1000" style="overflow: visible;">
                    <g id="grid-layer">
                        <path class="grid-line" d="M -500 -400 L 500 -400 M -500 -300 L 500 -300 M -500 -200 L 500 -200 M -500 -100 L 500 -100 M -500 100 L 500 100 M -500 200 L 500 200 M -500 300 L 500 300 M -500 400 L 500 400"></path>
                        <path class="grid-line" d="M -400 -500 L -400 500 M -300 -500 L -300 500 M -200 -500 L -200 500 M -100 -500 L -100 500 M 100 -500 L 100 500 M 200 -500 L 200 500 M 300 -500 L 300 500 M 400 -500 L 400 500"></path>
                        <line class="axis-line" x1="-500" y1="0" x2="500" y2="0"></line>
                        <line class="axis-line" x1="0" y1="-500" x2="0" y2="500"></line>
                        <rect class="viewbox-border" x="-500" y="-500" width="1000" height="1000"></rect>
                        <text class="axis-label" x="8" y="25">0,0</text>
                        <text class="axis-label" x="435" y="25">500</text>
                        <text class="axis-label" x="-495" y="25">-500</text>
                        <text class="axis-label" x="8" y="490">500</text>
                        <text class="axis-label" x="8" y="-475">-500</text>
                    </g>

                    <g id="glyph-scaler">
                        <g id="glyph-shifter">
                            <g id="glyph-layers" class="glyph-display-fill" transform="scale(1, -1)">
                                <path id="glyph-bg" d=""></path>
                                <path id="glyph-main" d=""></path>
                                <path id="glyph-compare-data1"  class="compare-path" d=""></path>
                                <path id="glyph-compare-data2" class="compare-path" d=""></path>
                                <path id="glyph-compare-data3" class="compare-path" d=""></path>
                            </g>
                        </g>
                    </g>
                </svg>
            </div>
        </div>
            <div class="controls-row outline-below-viewbox">
                <label class="outline-row-label">윤곽 누적</label>
                <div class="outline-toolbar-col">
                    <div class="outline-step-row">
                        <button type="button" class="btn-step" id="outline-prev" onclick="stepOutline(-1)" title="한 획 줄이기">&lt;</button>
                        <span id="outline-step-label">-</span>
                        <button type="button" class="btn-step" id="outline-next" onclick="stepOutline(1)" title="한 획 더하기">&gt;</button>
                        <button type="button" class="btn-outline-text" id="outline-all" onclick="setOutlineStrokeCountToAll()" title="모든 획 표시">전체</button>
                        <button type="button" class="btn-outline-text" id="outline-clear" onclick="setOutlineStrokeCountToZero()" title="획 0(빈 윤곽)">초기화</button>
                    </div>
                    <button type="button" class="btn-outline-text" id="outline-play-cumulative" onclick="playOutlineCumulativeFromZeroToN()" title="0획부터 한 획씩 누적해 마지막까지 자동 표시">재생</button>
                </div>
            </div>
        </div>

        <div class="toolbar">
            <div class="controls-row scale-control">
                <label>Character Scale</label>
                <input type="range" id="glyph-scale" min="0.5" max="1.0" step="0.01" value="0.9" oninput="updateGlyphScale(this.value)">
                <span id="scale-val">0.90x</span>
            </div>
            <div class="controls-row opacity-control">
                <label>Font Opacity</label>
                <input type="range" id="font-opacity" min="0" max="1.0" step="0.01" value="0.15" oninput="updateFontOpacity(this.value)">
                <span id="opacity-val">15%</span>
            </div>
            <div class="controls-row offset-control">
                <label>Vertical Offset</label>
                <input type="range" id="vertical-offset" min="700" max="1000" step="5" value="870" oninput="updateVerticalOffset(this.value)">
                <span id="offset-val">870</span>
            </div>
            <div class="controls-row display-mode-row">
                <label class="outline-row-label">표시</label>
                <div class="display-mode-buttons">
                    <button type="button" class="btn-outline-text btn-display-mode display-mode-active" id="btn-display-fill" onclick="setGlyphDisplayMode('fill')" title="면으로 채우기">면</button>
                    <button type="button" class="btn-outline-text btn-display-mode" id="btn-display-stroke" onclick="setGlyphDisplayMode('stroke')" title="윤곽선만">윤곽</button>
                </div>
            </div>
            <div class="controls-row">
                <label class="outline-row-label">3 폴더 비교</label>
                <div class="outline-toolbar-col">
                    <button type="button" class="btn-outline-text" id="btn-compare-toggle" onclick="toggleCompareMode()" title="data1/data2/data3 의 같은 글자를 하나의 viewBox에 겹쳐 표시합니다">비교 모드</button>
                    <div class="compare-legend" id="compare-legend">
                        <span class="dot data1"   id="legend-data1">data1</span>
                        <span class="dot data2"  id="legend-data2">data2</span>
                        <span class="dot data3"  id="legend-data3">data3</span>
                    </div>
                </div>
            </div>
            <div class="controls-row order-edit-controls-row">
                <label class="outline-row-label">order (획 순서)</label>
                <div class="outline-toolbar-col">
                    <div id="order-edit-list"></div>
                    <div class="order-edit-actions">
                        <button type="button" class="btn-outline-text" id="btn-apply-orders" onclick="applyStrokeOutlineOrders()" title="order·radical(숫자 1=참, 0=거짓) 변경을 캐시에 반영하고 윤곽을 다시 계산합니다">순서·부수 적용</button>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </main>

    <script>
        const OUTLINE_PLAY_STEP_MS = 420;
        const DEFAULT_FONT_OPACITY = 0.15;

        let allCharacters = [];
        const DEFAULT_DATA_DIR = 'data';
        const COMPARE_FOLDERS = ['data1', 'data2', 'data3'];
        let currentDataDir = DEFAULT_DATA_DIR;
        const characterCaches = { [DEFAULT_DATA_DIR]: {} };
        let currentCharacterObj = null;
        let outlineSegments = [];
        let outlineStrokeCount = 0;
        let outlineCumulativePlaying = false;
        let outlinePlaybackGeneration = 0;
        let compareMode = false;

        function getCharacterCache() {
            if (!characterCaches[currentDataDir]) characterCaches[currentDataDir] = {};
            return characterCaches[currentDataDir];
        }

        async function onDatasetChange(dir) {
            const next = String(dir || '').trim() || DEFAULT_DATA_DIR;
            if (next === currentDataDir) return;
            currentDataDir = next;
            if (!characterCaches[currentDataDir]) characterCaches[currentDataDir] = {};
            if (currentCharacterObj && currentCharacterObj.한자) {
                await loadCharData(currentCharacterObj.한자);
            } else {
                buildOrderEditRows({ stroke_outlines: [] });
            }
            updateRefreshDataButtonState();
        }

        async function fetchCharFromFolder(folder, char) {
            if (!characterCaches[folder]) characterCaches[folder] = {};
            const cache = characterCaches[folder];
            if (cache[char] !== undefined) return cache[char];
            try {
                const res = await fetch(`${folder}/${char}.json`);
                if (!res.ok) throw new Error('not found');
                const data = await res.json();
                cache[char] = data;
                return data;
            } catch {
                cache[char] = null;
                return null;
            }
        }

        function compareIdFor(folder) {
            return `glyph-compare-${folder}`;
        }

        function joinFontOutline(data) {
            if (!data) return '';
            const fo = data.font_outline;
            if (Array.isArray(fo)) return fo.filter((s) => typeof s === 'string' && s.trim()).join(' ');
            if (typeof fo === 'string') return fo.trim();
            return '';
        }

        async function loadCompareData() {
            if (!currentCharacterObj || !currentCharacterObj.한자) return;
            const char = currentCharacterObj.한자;
            const results = await Promise.all(
                COMPARE_FOLDERS.map((f) => fetchCharFromFolder(f, char))
            );
            COMPARE_FOLDERS.forEach((f, i) => {
                const data = results[i];
                const d = joinFontOutline(data);
                const pathEl = document.getElementById(compareIdFor(f));
                if (pathEl) pathEl.setAttribute('d', d);
                const legend = document.getElementById(`legend-${f}`);
                if (legend) legend.classList.toggle('missing', !d);
            });
        }

        function clearCompareData() {
            COMPARE_FOLDERS.forEach((f) => {
                const el = document.getElementById(compareIdFor(f));
                if (el) el.setAttribute('d', '');
                const legend = document.getElementById(`legend-${f}`);
                if (legend) legend.classList.remove('missing');
            });
        }

        async function toggleCompareMode() {
            compareMode = !compareMode;
            const layers = document.getElementById('glyph-layers');
            const btn = document.getElementById('btn-compare-toggle');
            if (layers) layers.classList.toggle('compare-on', compareMode);
            if (btn) {
                btn.classList.toggle('compare-active', compareMode);
                btn.textContent = compareMode ? '비교 모드 해제' : '비교 모드';
            }

            if (compareMode) {
                await loadCompareData();
            } else {
                clearCompareData();
            }
            applyOutlineStep();
        }

        function updateRefreshDataButtonState() {
            const btn = document.getElementById('btn-refresh-data');
            if (btn) btn.disabled = !currentCharacterObj || !currentCharacterObj.한자;
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function strokeOutlineRadicalIsTrue(item) {
            const v = item && item.radical;
            return v === 1 || v === '1';
        }

        function strokeOutlineRadicalDisplay(item) {
            const v = item && item.radical;
            if (v === undefined || v === null || v === '') return '—';
            return escapeHtml(String(v));
        }

        function buildOrderEditRows(data) {
            const list = document.getElementById('order-edit-list');
            const applyBtn = document.getElementById('btn-apply-orders');
            if (!list) return;

            list.innerHTML = '';
            const arr = Array.isArray(data.stroke_outlines) ? data.stroke_outlines : [];
            const objectRows = [];
            arr.forEach((item, index) => {
                if (!item || typeof item !== 'object') return;
                const path = String(item.path ?? item.d ?? '').trim();
                if (!path) return;
                objectRows.push({ item, index });
            });

            if (arr.length === 0) {
                list.innerHTML = '<span class="order-edit-hint">stroke_outlines가 없습니다. font_outline만 사용 중입니다.</span>';
                if (applyBtn) applyBtn.disabled = true;
                return;
            }

            if (objectRows.length === 0) {
                list.innerHTML =
                    '<span class="order-edit-hint">stroke_outlines가 문자열 배열이면 order를 여기서 바꿀 수 없습니다.</span>';
                if (applyBtn) applyBtn.disabled = true;
                return;
            }

            if (applyBtn) applyBtn.disabled = false;

            const table = document.createElement('table');
            table.className = 'order-edit-table';
            const thead = document.createElement('thead');
            thead.innerHTML = `
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">order 현재</th>
                    <th scope="col">order 변경</th>
                    <th scope="col">path</th>
                    <th scope="col">radical 현재</th>
                    <th scope="col">부수 획</th>
                </tr>
            `;
            const tbody = document.createElement('tbody');

            objectRows.forEach(({ item, index }) => {
                const currentOrder = strokeOutlineOrder(item, index);
                const radShown = strokeOutlineRadicalDisplay(item);
                const radChecked = strokeOutlineRadicalIsTrue(item) ? 'checked' : '';
                const pathStr = String(item.path ?? item.d ?? '').trim();
                const pathEscaped = escapeHtml(pathStr);
                const pathSvg = pathStr
                    ? `<svg viewBox="-100 -1000 1200 1200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"><g transform="scale(1,-1)"><path d="${pathEscaped}"></path></g></svg>`
                    : '';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="col-idx">${index + 1}</td>
                    <td class="col-order-current"><strong>${currentOrder}</strong></td>
                    <td class="col-order-change">
                        <input type="number" step="1" class="order-change-input" value="${currentOrder}" data-idx="${index}" aria-label="order 변경 행 ${index + 1}">
                    </td>
                    <td class="col-path" title="${pathEscaped}">${pathSvg}</td>
                    <td class="col-radical-current"><strong>${radShown}</strong></td>
                    <td class="col-radical-cell">
                        <label class="order-radical-wrap">
                            <input type="checkbox" class="order-radical-cb" data-idx="${index}" ${radChecked} title="부수 획: 적용 시 radical을 숫자 1(참) 또는 0(거짓)으로 저장합니다." aria-label="부수 획 행 ${index + 1}">
                        </label>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            table.appendChild(thead);
            table.appendChild(tbody);
            list.appendChild(table);
        }

        function applyStrokeOutlineOrders() {
            const char = currentCharacterObj && currentCharacterObj.한자;
            if (!char) return;
            const cache = getCharacterCache();
            const data = cache[char];
            if (!data || !Array.isArray(data.stroke_outlines)) return;

            const inputs = document.querySelectorAll('#order-edit-list .order-change-input');
            if (!inputs.length) return;

            inputs.forEach((input) => {
                const idx = parseInt(input.getAttribute('data-idx'), 10);
                if (Number.isNaN(idx) || idx < 0 || idx >= data.stroke_outlines.length) return;
                const item = data.stroke_outlines[idx];
                if (!item || typeof item !== 'object') return;
                const raw = String(input.value).trim();
                const n = parseInt(raw, 10);
                if (Number.isNaN(n)) return;
                item.order = n;
            });

            document.querySelectorAll('#order-edit-list .order-radical-cb').forEach((cb) => {
                const idx = parseInt(cb.getAttribute('data-idx'), 10);
                if (Number.isNaN(idx) || idx < 0 || idx >= data.stroke_outlines.length) return;
                const item = data.stroke_outlines[idx];
                if (!item || typeof item !== 'object') return;
                item.radical = cb.checked ? 1 : 0;
            });

            renderGlyph(data);
            buildOrderEditRows(data);
        }

        async function refreshCurrentCharData() {
            const char = currentCharacterObj && currentCharacterObj.한자;
            if (!char) return;

            const loader = document.getElementById('loader');
            const btn = document.getElementById('btn-refresh-data');
            if (btn) btn.disabled = true;
            if (loader) loader.style.display = 'block';

            try {
                const url = `${currentDataDir}/${char}.json?t=${Date.now()}`;
                const res = await fetch(url, { cache: 'no-store' });
                if (!res.ok) throw new Error('Data not found');
                const data = await res.json();
                getCharacterCache()[char] = data;
                renderGlyph(data);
                buildOrderEditRows(data);
                if (compareMode) {
                    COMPARE_FOLDERS.forEach((f) => {
                        if (characterCaches[f]) delete characterCaches[f][char];
                    });
                    await loadCompareData();
                }
            } catch (err) {
                console.error(err);
                window.alert(`'${currentDataDir}/${char}.json' 를 새로 고침하지 못했습니다. 파일 경로와 서버 실행 여부를 확인하세요.`);
            } finally {
                if (loader) loader.style.display = 'none';
                updateRefreshDataButtonState();
            }
        }

        function setGlyphDisplayMode(mode) {
            const layers = document.getElementById('glyph-layers');
            const fillBtn = document.getElementById('btn-display-fill');
            const strokeBtn = document.getElementById('btn-display-stroke');
            if (!layers || !fillBtn || !strokeBtn) return;
            const isStroke = mode === 'stroke';
            layers.classList.remove('glyph-display-fill', 'glyph-display-stroke');
            layers.classList.add(isStroke ? 'glyph-display-stroke' : 'glyph-display-fill');
            fillBtn.classList.toggle('display-mode-active', !isStroke);
            strokeBtn.classList.toggle('display-mode-active', isStroke);
            window.glyphDisplayMode = isStroke ? 'stroke' : 'fill';
            updateVisibility();
        }

        function strokeOutlineOrder(item, index) {
            if (item.order === undefined || item.order === null) return index + 1;
            const n = Number(item.order);
            return Number.isNaN(n) ? index + 1 : n;
        }

        function parseOrderedStrokeOutlines(strokeOutlines) {
            if (!Array.isArray(strokeOutlines) || strokeOutlines.length === 0) return [];

            const entries = strokeOutlines
                .map((item, index) => {
                    if (typeof item === 'string') {
                        const path = item.trim();
                        return path ? { order: index + 1, path, _idx: index } : null;
                    }
                    if (item && typeof item === 'object') {
                        const path = String(item.path ?? item.d ?? '').trim();
                        if (!path) return null;
                        return { order: strokeOutlineOrder(item, index), path, _idx: index };
                    }
                    return null;
                })
                .filter(Boolean);

            entries.sort((a, b) => (a.order !== b.order ? a.order - b.order : a._idx - b._idx));
            return entries.map((e) => e.path);
        }

        function parseOutlineSegments(data) {
            const strokeOutlines = data.stroke_outlines;
            const fontOutline = data.font_outline;
            if (Array.isArray(strokeOutlines) && strokeOutlines.length > 0) {
                const fromStrokes = parseOrderedStrokeOutlines(strokeOutlines);
                if (fromStrokes.length > 0) return fromStrokes;
            }
            if (Array.isArray(fontOutline) && fontOutline.length > 0) {
                return fontOutline.filter((s) => typeof s === 'string' && s.trim());
            }
            if (typeof fontOutline === 'string' && fontOutline.trim()) {
                return [fontOutline.trim()];
            }
            return [];
        }

        function applyOutlineStep() {
            const n = outlineSegments.length;
            const d =
                n === 0 || outlineStrokeCount <= 0
                    ? ''
                    : outlineSegments.slice(0, Math.min(outlineStrokeCount, n)).join(' ');
            document.getElementById('glyph-bg').setAttribute('d', d);
            document.getElementById('glyph-main').setAttribute('d', d);

            const locked = outlineCumulativePlaying || compareMode;
            document.getElementById('outline-step-label').textContent = n ? `${outlineStrokeCount} / ${n}` : '-';
            document.getElementById('outline-prev').disabled = locked || n === 0 || outlineStrokeCount <= 0;
            document.getElementById('outline-next').disabled = locked || n === 0 || outlineStrokeCount >= n;
            document.getElementById('outline-all').disabled = locked || n === 0 || outlineStrokeCount >= n;
            document.getElementById('outline-clear').disabled = locked || n === 0 || outlineStrokeCount <= 0;
            const playBtn = document.getElementById('outline-play-cumulative');
            playBtn.disabled = locked || n === 0;
            playBtn.textContent = outlineCumulativePlaying ? '재생 중…' : '재생';
        }

        function stepOutline(delta) {
            if (outlineSegments.length === 0) return;
            outlineStrokeCount = Math.min(
                outlineSegments.length,
                Math.max(0, outlineStrokeCount + delta)
            );
            applyOutlineStep();
        }

        function setOutlineStrokeCountToAll() {
            if (outlineSegments.length === 0) return;
            outlineStrokeCount = outlineSegments.length;
            applyOutlineStep();
        }

        function setOutlineStrokeCountToZero() {
            outlineStrokeCount = 0;
            applyOutlineStep();
        }

        function stopOutlinePlaybackIfStale(gen) {
            if (gen === outlinePlaybackGeneration) return false;
            outlineCumulativePlaying = false;
            applyOutlineStep();
            return true;
        }

        async function playOutlineCumulativeFromZeroToN() {
            if (outlineSegments.length === 0 || outlineCumulativePlaying) return;
            const n = outlineSegments.length;
            const gen = outlinePlaybackGeneration;
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));
            outlineCumulativePlaying = true;
            applyOutlineStep();

            outlineStrokeCount = 0;
            applyOutlineStep();
            await wait(OUTLINE_PLAY_STEP_MS);
            if (stopOutlinePlaybackIfStale(gen)) return;

            for (let i = 1; i <= n; i++) {
                outlineStrokeCount = i;
                applyOutlineStep();
                await wait(OUTLINE_PLAY_STEP_MS);
                if (stopOutlinePlaybackIfStale(gen)) return;
            }

            outlineCumulativePlaying = false;
            applyOutlineStep();
        }

        async function init() {
            try {
                const res = await fetch('input.json');
                allCharacters = await res.json();

                setupSearch();
                renderResults('');

                const datasetSelect = document.getElementById('dataset-select');
                if (datasetSelect) datasetSelect.value = currentDataDir;

                updateGlyphScale(document.getElementById('glyph-scale').value);
                updateFontOpacity(document.getElementById('font-opacity').value);
                updateVerticalOffset(document.getElementById('vertical-offset').value);
                setGlyphDisplayMode('fill');

                const startChar = allCharacters[0];
                if (startChar) await selectCharacter(startChar);
                updateRefreshDataButtonState();
            } catch (err) {
                console.error('Failed to load input.json', err);
            }
        }

        function updateGlyphScale(val) {
            document.getElementById('glyph-scaler').setAttribute('transform', `scale(${val})`);
            document.getElementById('scale-val').innerText = `${parseFloat(val).toFixed(2)}x`;
        }

        function updateFontOpacity(val) {
            window.currentFontOpacity = val;
            updateVisibility();
            document.getElementById('opacity-val').innerText = `${Math.round(Number(val) * 100)}%`;
        }

        function updateVerticalOffset(val) {
            const yOffset = parseInt(val, 10) - 500;
            document.getElementById('glyph-shifter').setAttribute('transform', `translate(-500, ${yOffset})`);
            document.getElementById('offset-val').innerText = String(val);
        }

        function setupSearch() {
            const input = document.getElementById('search-input');
            input.addEventListener('input', (e) => {
                renderResults(e.target.value);
            });
        }

        function renderResults(query) {
            const grid = document.getElementById('results-grid');
            grid.innerHTML = '';
            
            const filtered = allCharacters
                .filter((c) => c.한자.includes(query) || (c.음 && c.음.includes(query)))
                .slice(0, 100);

            filtered.forEach((c) => {
                const card = document.createElement('div');
                card.className = 'char-card';
                if (currentCharacterObj && c.한자 === currentCharacterObj.한자) card.classList.add('active');
                
                card.innerHTML = `
                    <div class="glyph">${c.한자}</div>
                    <div class="eum">${c.음 || ''}</div>
                `;
                card.onclick = () => selectCharacter(c);
                grid.appendChild(card);
            });
        }

        async function selectCharacter(charObj) {
            currentCharacterObj = charObj;
            document.getElementById('display-char').innerText = charObj.한자;
            document.getElementById('display-eum').innerText = `음: ${charObj.음} (ID: ${charObj.id})`;

            document.querySelectorAll('.char-card').forEach((card) => {
                card.classList.toggle('active', card.querySelector('.glyph').innerText === charObj.한자);
            });

            await loadCharData(charObj.한자);
            updateRefreshDataButtonState();
        }

        async function loadCharData(char) {
            const loader = document.getElementById('loader');
            loader.style.display = 'block';

            const cache = getCharacterCache();
            let data = cache[char];
            if (!data) {
                try {
                    const res = await fetch(`${currentDataDir}/${char}.json`);
                    if (!res.ok) throw new Error('Data not found');
                    data = await res.json();
                    cache[char] = data;
                } catch (err) {
                    console.error(err);
                    loader.style.display = 'none';
                    buildOrderEditRows({ stroke_outlines: [] });
                    return;
                }
            }

            renderGlyph(data);
            buildOrderEditRows(data);
            if (compareMode) await loadCompareData();
            loader.style.display = 'none';
        }

        function renderGlyph(data) {
            outlinePlaybackGeneration += 1;
            outlineCumulativePlaying = false;
            outlineSegments = parseOutlineSegments(data);
            outlineStrokeCount = 0;
            applyOutlineStep();
            updateVisibility();
        }

        function updateVisibility() {
            const opacity =
                window.currentFontOpacity !== undefined ? window.currentFontOpacity : DEFAULT_FONT_OPACITY;
            document.getElementById('glyph-bg').style.opacity = opacity;
            document.getElementById('glyph-main').style.opacity = 1;
        }

        window.onload = init;
    </script>
</body>
</html>
